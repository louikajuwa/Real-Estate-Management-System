services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    networks:
      - realnet
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-realestate}
      DB_USERNAME: ${DB_USERNAME:-realestate}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8100:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - realnet
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-realestate}
      MYSQL_USER: ${DB_USERNAME:-realestate}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3308:3306"
    networks:
      - realnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "127.0.0.1:8101:80"
    networks:
      - realnet
    depends_on:
      - mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - realnet
    restart: unless-stopped

  node:
    build:
      context: ./socket-server
    ports:
      - "6001:6001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LARAVEL_URL: http://nginx
      PORT: 6001
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN:-http://localhost:8100}
    networks:
      - realnet
    depends_on:
      - redis
      - nginx
    restart: unless-stopped

networks:
  realnet:
    driver: bridge

volumes:
  db_data:
  redis_data:
